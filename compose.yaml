services:
  bot:
    build:
      context: .
    image: ch00chka-bot:latest
    init: true
    restart: unless-stopped
    environment:
      bot_token: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      AI_api_token: ${AI_API_TOKEN:?Set AI_API_TOKEN in .env}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_PARTICIPATION_MODEL: ${AI_PARTICIPATION_MODEL:-deepseek-v4-flash}
      AI_RESEARCH_MODEL: ${AI_RESEARCH_MODEL:-deepseek-v4-flash}
      AI_OBSERVER_MODEL: ${AI_OBSERVER_MODEL:-deepseek-v4-flash}
      AI_SUMMARY_MODEL: ${AI_SUMMARY_MODEL:-deepseek-v4-flash}
      AI_THINKING_ENABLED: ${AI_THINKING_ENABLED:-false}
      AI_OBSERVER_ENABLED: ${AI_OBSERVER_ENABLED:-true}
      AI_RECENT_MESSAGES_LIMIT: ${AI_RECENT_MESSAGES_LIMIT:-30}
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-true}
      AI_SUMMARY_BATCH_SIZE: ${AI_SUMMARY_BATCH_SIZE:-8}
      AI_SUMMARY_MAX_BATCH_MESSAGES: ${AI_SUMMARY_MAX_BATCH_MESSAGES:-60}
      AI_SUMMARY_MAX_CHARS: ${AI_SUMMARY_MAX_CHARS:-2000}
      AI_SUMMARY_RETRY_COOLDOWN_SECONDS: ${AI_SUMMARY_RETRY_COOLDOWN_SECONDS:-900}
      AI_BRIEF_MAX_TOKENS: ${AI_BRIEF_MAX_TOKENS:-160}
      AI_NORMAL_MAX_TOKENS: ${AI_NORMAL_MAX_TOKENS:-500}
      AI_DETAILED_MAX_TOKENS: ${AI_DETAILED_MAX_TOKENS:-1000}
      AI_RESEARCH_ENABLED: ${AI_RESEARCH_ENABLED:-true}
      RESEARCH_CACHE_TTL_SECONDS: ${RESEARCH_CACHE_TTL_SECONDS:-21600}
      RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-8}
      RESEARCH_MAX_FACTS: ${RESEARCH_MAX_FACTS:-6}
      RESEARCH_WEB_BASE_URL: http://searxng:8080
      TELEGRAM_DROP_PENDING_UPDATES: ${TELEGRAM_DROP_PENDING_UPDATES:-true}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-0}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_API_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_API_REQUEST_TIMEOUT_SECONDS:-300}
      TELEGRAM_UPLOAD_CHUNK_SIZE: ${TELEGRAM_UPLOAD_CHUNK_SIZE:-1048576}
      MEDIA_TEMP_DIR: /data/media
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-48000000}
      MEDIA_MAX_DURATION_SECONDS: ${MEDIA_MAX_DURATION_SECONDS:-600}
      MEDIA_MAX_CONCURRENT_DOWNLOADS: ${MEDIA_MAX_CONCURRENT_DOWNLOADS:-2}
      MEDIA_MAX_ITEMS: ${MEDIA_MAX_ITEMS:-50}
      MEDIA_PROXY_URL: ${MEDIA_PROXY_URL:-}
      MEDIA_COOKIES_FILE: ${MEDIA_COOKIES_FILE:-}
      MEDIA_YOUTUBE_COOKIES_FILE: ${MEDIA_YOUTUBE_COOKIES_FILE:-/run/secrets/ch00chka/youtube-cookies.txt}
      MEDIA_TIKTOK_COOKIES_FILE: ${MEDIA_TIKTOK_COOKIES_FILE:-/run/secrets/ch00chka/tiktok-cookies.txt}
      MEDIA_INSTAGRAM_COOKIES_FILE: ${MEDIA_INSTAGRAM_COOKIES_FILE:-/run/secrets/ch00chka/instagram-cookies.txt}
      MEDIA_COOKIE_JAR_DIR: /data/cookies
      MEDIA_COOKIE_JAR_RESET: ${MEDIA_COOKIE_JAR_RESET:-false}
      LOCAL_MEDIA_MAX_BYTES: ${LOCAL_MEDIA_MAX_BYTES:-1900000000}
      LOCAL_MEDIA_MAX_DURATION_SECONDS: ${LOCAL_MEDIA_MAX_DURATION_SECONDS:-14400}
      DB_PATH: /data/bot_talker_memory.db
    depends_on:
      searxng:
        condition: service_started
      telegram-bot-api:
        condition: service_started
        required: false
    volumes:
      - bot-data:/data
      - ./cookies/youtube-cookies.txt:/run/secrets/ch00chka/youtube-cookies.txt:ro
      - ./cookies/tiktok-cookies.txt:/run/secrets/ch00chka/tiktok-cookies.txt:ro
      - ./cookies/instagram-cookies.txt:/run/secrets/ch00chka/instagram-cookies.txt:ro

  searxng:
    image: searxng/searxng@sha256:3aed6b4bfb4e6a2b3b94c890dafb3f35cb2588493b83818434aa260e8bdeb4d4
    init: true
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_LIMITER: "false"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

  telegram-bot-api:
    profiles: ["local"]
    image: aiogram/telegram-bot-api@sha256:4154d9918c86eaae2643cff857b1091428ebe0923015af8672cd587cb6b8b8e7
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  bot-data:
  telegram-bot-api-data:
